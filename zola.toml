cta_url = "mailto:riomakerspace@gmail.com?subject=Quero%20participar%20do%20RMS"

[[extra.home.final_ctas]]
text = "Tem uma escola ou instituição?"
cta_label = "Leve o RMS pra você"
cta_url = "mailto:riomakerspace@gmail.com?subject=Parceria%20institucional%20com%20o%20RMS"

