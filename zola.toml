base_url = "https://www.riomakerspace.com.br"
title = "Rio Maker Space"
description = "Rio Maker Space (RMS) é uma comunidade maker aberta no Rio de Janeiro que constrói foguetes, balões estratosféricos, robótica e tecnologia open source desde 2015."
author = "Rio Maker Space"
default_language = "pt-BR"
taxonomies = [{ name = "tags", rss = true, paginate_by = 5 }]


[markdown]
github_alerts = true
insert_anchor_links = "heading"

[markdown.highlighting]
# Kita theme supports both "inline" and "class" modes.
style = "class"

light_theme = "light-plus"
dark_theme = "dark-plus"


# The Kita theme config.
[extra]
# Enable KaTex math formula support globally.
math = false
# Enable mermaid support globally.
mermaid = false
# Enable comment support globally.
comment = false
# Enable floating table of contents on the right side of the post page.
side_toc = false
# The URL of social image (Open Graph / share preview).
# TODO: add a real branded share image to static/images and point this at it, e.g. "images/social.png".
# social_image = "images/social.png"

# The Kita style config.
[extra.style]
bg_color = "#f7f7f5"
bg_dark_color = "#0c0c0d"
# header_blur = true
header_color = "#f7f7f5"
header_dark_color = "#0c0c0d"

# Logo shown on the right side of the header (desktop only).
logo_url = "images/RMS-logo.png"

# The profile card is not rendered on the homepage (which uses the custom
# `home.html` template below) but is kept here in case a blog-style section
# using the default `index.html`/`section.html` layout is added later.
[extra.profile]
name = "Rio Maker Space"
bio = "Comunidade de makers, estudantes e curiosos que constrói o futuro com as próprias mãos."
# avatar_url = "images/logo.png" # TODO: add a real RMS logo/avatar to static/images.

# The top menu.
[[extra.menu]]
name = "Projetos"
url = "$BASE_URL/projects"

[[extra.menu]]
name = "Eventos"
url = "$BASE_URL/events"

[[extra.menu]]
name = "Sobre"
url = "$BASE_URL/about"

# The page footer options.
[extra.footer]
since = 2015

# The giscus comment options, only available when comment is enabled.
[extra.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = 1
reactions_enabled = 0
emit_metadata = 0
input_position = "top"
theme = "light"
lang = "pt-BR"
loading = "lazy"

# --- RMS-specific site content below (not part of the upstream Kita theme) ---
# These tables drive `templates/home.html` and `templates/partials/footer.html`.
# Anything marked TODO is a stubbed placeholder pending real data/links.

[extra.home]
hero_image = "images/hero-background.jpg"
hero_eyebrow = "RIO MAKER SPACE"
hero_headline = "Tecnologia aberta para transformar curiosidade em futuro."
hero_subheadline = "Somos uma comunidade que conecta educação prática, projetos reais e pessoas que querem criar. Do primeiro circuito ao céu, fazemos tecnologia aberta acontecer no Rio de Janeiro."
hero_cta_primary_label = "Quero participar"
hero_cta_primary_url = "https://chat.whatsapp.com/JlSiWCgBQrkJ223PX8Cl3i"
hero_cta_secondary_label = "Quero ser parceiro"
hero_cta_secondary_url = "mailto:contato@riomakerspace.com.br?subject=Quero%20ser%20parceiro%20do%20RMS"

# Section 2 — "Impacto que se mede" eyebrow/heading are rendered from
# stats.toml; this controls the small section eyebrow label.
impact_eyebrow = "Métricas da comunidade"

# Section 3 — Três pilares
pillars_eyebrow = "Fundamentos"
pillars_heading = "Três formas de fazer acontecer"
pillars_support = "Criamos experiências onde tecnologia, aprendizagem e comunidade avançam juntas."
pillar_images = [
  "images/pillar-community.jpg",
  "images/pillar-tech.jpg",
  "images/pillar-maker.jpg",
]

# Section 4 — "Na prática": two cards (Projetos / Eventos)
practice_eyebrow = "Na prática"
practice_heading = "Da bancada ao céu"
practice_support = "Projetos e encontros que transformam conhecimento em experiências abertas, concretas e compartilháveis."

# Section 7 — CTA final: três portas de entrada (kept here in the flat
# [extra.home] section so they aren't swallowed by a sub-table header below).
final_heading = "Vamos construir o próximo projeto juntos?"
final_eyebrow = "Próximos passos"

[extra.home.practice_projects]
heading = "Projetos que exploram limites"
text = "Desenvolvemos e apoiamos projetos de eletrônica, robótica, IoT e aeroespacial que saem da bancada para testar o mundo real."
image = "images/projects-hero.jpg"
highlights = [
  "Projeto ASA: 23 km de altitude",
  "Foguete UIARA: apogeu de 1 km, em parceria com CBPF e UFRJ",
  "BEC: sensores atmosféricos, telemetria e comunicação LoRa de longo alcance",
]
cta_label = "Conheça nossos projetos"
cta_url = "$BASE_URL/projects"

[extra.home.practice_events]
heading = "Eventos que conectam pessoas"
text = "Reunimos makers, estudantes, pesquisadores, famílias e comunidades para descobrir, testar e construir tecnologia junto."
image = "images/events-hero.jpg"
highlights = [
  "Arduino Day: encontros anuais de tecnologia aberta e criação coletiva",
  "Palestras, competições, exposições interativas e demonstrações técnicas",
  "Conexão entre comunidades, grupos de pesquisa e instituições de ensino",
]
cta_label = "Veja nossos eventos"
cta_url = "$BASE_URL/events"

# Section 5 — Próximos encontros fallback (shown when no upcoming events)
[extra.home.upcoming_fallback]
heading = "O próximo projeto pode começar com você"
text = "Acompanhe os próximos encontros, projetos e experiências da comunidade RMS."
fallback_text = "Quer receber os próximos convites do RMS? Entre para a comunidade e acompanhe nossos canais."
cta_label = "Quero acompanhar"
cta_url = "https://chat.whatsapp.com/JlSiWCgBQrkJ223PX8Cl3i"

# Section 6 — Comunidade, parceiros e conhecimento aberto
[extra.home.community]
heading = "Feito em comunidade. Compartilhado em aberto."
text = "O RMS constrói junto com makers, escolas, grupos de pesquisa, instituições e comunidades que acreditam que tecnologia deve ser acessível, prática e compartilhável."
open_source_heading = "Conhecimento aberto por princípio"
open_source_text = "Projetos, aprendizados e processos que podem ser compartilhados, adaptados e levados adiante. A documentação faz parte do que construímos."
open_source_cta_label = "Explorar documentação e repositórios"
open_source_url = "https://github.com/Instituto-RMS"

# Section 7 — CTA final: three doors (final_heading / final_eyebrow are
# defined above in the flat [extra.home] section; the array is here).
[[extra.home.final_ctas]]
text = "Quero criar, aprender e me aproximar da comunidade maker."
cta_label = "Quero participar"
cta_url = "https://chat.whatsapp.com/JlSiWCgBQrkJ223PX8Cl3i"

[[extra.home.final_ctas]]
text = "Quero conversar sobre atividades, eventos ou experiências de tecnologia aberta."
cta_label = "Levar para minha escola ou organização"
cta_url = "mailto:contato@riomakerspace.com.br?subject=Experi%C3%AAncia%20RMS%20para%20escola%20ou%20organiza%C3%A7%C3%A3o"

[[extra.home.final_ctas]]
text = "Quero apoiar, cocriar ou conectar o RMS a uma nova oportunidade."
cta_label = "Quero construir uma parceria"
cta_url = "mailto:contato@riomakerspace.com.br?subject=Parceria%20com%20o%20RMS"

