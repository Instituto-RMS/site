url = "$BASE_URL/projects/projeto-asa"

[[project]]
icon = "🛰️"
name = "StarChain"
blurb = "Nosso projeto mais ousado: uma constelação de satélites para infraestrutura descentralizada em órbita."
url = "$BASE_URL/projects/starchain"
