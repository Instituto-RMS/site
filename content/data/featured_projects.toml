# Featured projects shown in the "Projetos em destaque" section of the homepage.
# `url` fields point at the corresponding page under content/projects/ —
# keep the slugs in sync if a project file is renamed.

[[project]]
icon = "🚀"
name = "Foguete UIARA"
blurb = "Desenvolvido com CBPF e UFRJ, alcançou 1 km de altitude com telemetria feita 100% por makers voluntários."
url = "$BASE_URL/projects/foguete-uiara"

[[project]]
icon = "🎈"
name = "Balão de Exploração Científica (BEC)"
